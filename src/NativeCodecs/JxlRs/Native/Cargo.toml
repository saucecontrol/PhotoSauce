[package]
name = "photosauce-jxlrs"
version = "0.6.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "jxlrs"
crate-type = ["cdylib"]

[dependencies]
jxl = { version = "=0.6.0", default-features = true }
rayon = "1.12.0"

[profile.release]
lto = "thin"
panic = "unwind"
strip = "debuginfo"
